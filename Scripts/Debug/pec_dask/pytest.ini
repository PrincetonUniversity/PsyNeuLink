; Self-contained pytest config for the pec_dask_mle correctness suite.
; Run from this directory so the repo-root setup.cfg options (--ignore=Scripts,
; pydocstyle/pycodestyle, xdist) do not apply:
;
;     cd Scripts/Debug/pec_dask && python -m pytest tests -v
[pytest]
addopts = -ra
markers =
    dask: spins up a Dask LocalCluster (slower integration tests)
    pnl: builds/executes PsyNeuLink models (slow; LLVM compile per fresh PEC)
