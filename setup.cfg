# pycodestyle cannot be configured from pyproject.toml, so its configuration
# is kept here (pycodestyle/pytest-pycodestyle read the [pycodestyle] section
# from setup.cfg or tox.ini). All other build and tool configuration, including
# versioneer's [tool.versioneer] section, lives in pyproject.toml.
[pycodestyle]
# for code explanation see https://pep8.readthedocs.io/en/latest/intro.html#error-codes
ignore = E114,E115,E116,E121,E122,E123,E124,E125,E126,E127,E128,E129,E131,E201,E202,E203,E221,E225,E231,E241,E251,E252,E261,E262,E265,E301,E302,E303,E306,E501,E721,E722,E731,E741,W503,W504
# Ignore non-PNL python files
# psyneulink/core/rpc/graph_pb2.py -- generated by protobuf compiler
# golden_kernels -- generated Triton kernel snapshots; must stay byte-identical
#                   to emitter output (also excluded in [tool.ruff] exclude)
exclude = .git/*,Scripts/*,__pytest__/*,docs/*,bin/*,psyneulink/core/rpc/graph_pb2.py,.venv/*,*/golden_kernels/*
