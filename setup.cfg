# versioneer reads its configuration from this file. All other build and tool
# configuration (metadata, dependencies, pytest, coverage, ruff) lives in
# pyproject.toml. pycodestyle is also kept here because it cannot be configured
# from pyproject.toml (pycodestyle/pytest-pycodestyle read setup.cfg/tox.ini).
[versioneer]
VCS = git
style = pep440
versionfile_source = psyneulink/_version.py
versionfile_build = psyneulink/_version.py
tag_prefix = v
parentdir_prefix = psyneulink-

[pycodestyle]
# for code explanation see https://pep8.readthedocs.io/en/latest/intro.html#error-codes
ignore = E114,E115,E116,E121,E122,E123,E124,E125,E126,E127,E128,E129,E131,E201,E202,E203,E221,E225,E231,E241,E251,E252,E261,E262,E265,E301,E302,E303,E306,E501,E721,E722,E731,E741,W503,W504
# Ignore non-PNL python files
# psyneulink/core/rpc/graph_pb2.py -- generated by protobuf compiler
exclude = .git/*,Scripts/*,__pytest__/*,docs/*,bin/*,psyneulink/core/rpc/graph_pb2.py,.venv/*
