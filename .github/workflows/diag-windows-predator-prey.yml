name: DIAG Windows predator-prey crash

# Diagnostic workflow for the intermittent Windows access-violation crash in
#   tests/models/test_greedy_agent.py::test_predator_prey[...-ExecutionMode._LLVMPerNode]
# (worker crashes with "Windows fatal exception: access violation" inside the
#  JIT-compiled controller execution). This is a throwaway branch workflow:
# it loops the failing test many times on Windows to (a) measure the crash
# rate, (b) compare LLVM optimization levels to localize the trigger, and
# (c) capture a full crash dump for post-mortem analysis.
#
# Primary question: does PNL_LLVM_DEBUG=opt=0 make the crash disappear?
#   - vanishes at opt=0  -> optimizer / vectorizer / codegen trigger
#   - persists at opt=0  -> base-codegen / ABI bug
#
# Trigger: pushing this branch, or manual dispatch (with tunable inputs).

on:
  push:
    branches:
      - 'diag/windows-predator-prey-crash'
  workflow_dispatch:
    inputs:
      count:
        description: 'pytest-repeat count per test parametrization'
        default: '30'
      python-version:
        description: 'Python version'
        default: '3.11'
      test-filter:
        description: '-k filter selecting which parametrizations to loop'
        default: '_LLVMPerNode'

concurrency:
  group: diag-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 'default' leaves PNL_LLVM_DEBUG unset (opt=2, matches CI); '0' forces opt=0.
        opt: ['default', '0']
    env:
      PYTHONFAULTHANDLER: '1'
      # opt=0 disables LLVM optimization + vectorization; empty keeps the CI default (opt=2).
      PNL_LLVM_DEBUG: ${{ matrix.opt == '0' && 'opt=0' || '' }}
      COUNT: ${{ github.event.inputs.count || '30' }}
      TEST_FILTER: ${{ github.event.inputs.test-filter || '_LLVMPerNode' }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 200

    - name: Checkout tags
      run: git fetch --tags origin master

    - name: Set up Python ${{ github.event.inputs.python-version || '3.11' }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ github.event.inputs.python-version || '3.11' }}

    - name: Install PNL package
      uses: ./.github/actions/install-pnl
      with:
        features: 'dev'

    - name: Install diagnostic tools
      shell: bash
      run: |
        pip install pytest-repeat
        choco install --no-progress -y procdump

    - name: Print numpy / llvmlite info
      shell: bash
      run: |
        python -c "import numpy; numpy.show_config()"
        python -c "import llvmlite, llvmlite.binding as b; print('llvmlite', llvmlite.__version__, 'LLVM', b.llvm_version_info)"

    - name: Register procdump as post-mortem debugger
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path C:\dumps | Out-Null
        # -ma full dump, -i install as the Just-in-Time (AeDebug) post-mortem debugger.
        # Any process that hits an unhandled access violation now auto-dumps to C:\dumps.
        procdump -accepteula -ma -i C:\dumps

    - name: Loop predator-prey test
      # Do not fail the job on a crash; we want the dump + the summary regardless.
      continue-on-error: true
      timeout-minutes: 150
      shell: bash
      run: |
        echo "PNL_LLVM_DEBUG='${PNL_LLVM_DEBUG}'  COUNT=${COUNT}  FILTER='${TEST_FILTER}'"
        # Mirror the CI invocation (-n logical, capture=sys) so parallel/xdist
        # conditions match the observed failure, and add --count to amplify.
        pytest "tests/models/test_greedy_agent.py::test_predator_prey" \
          -k "${TEST_FILTER}" \
          --count="${COUNT}" \
          --junit-xml=diag_out.xml \
          --verbosity=0 -n logical --capture=sys -o console_output_style=count \
          || echo "PYTEST_EXIT=$? (non-zero is expected if the crash reproduced)"

    - name: Uninstall procdump post-mortem debugger
      if: always()
      shell: pwsh
      run: procdump -u

    - name: Analyze crash dumps (best effort)
      if: always()
      shell: pwsh
      run: |
        $dumps = Get-ChildItem -Path C:\dumps -Filter *.dmp -ErrorAction SilentlyContinue
        if (-not $dumps) { Write-Host "No crash dumps produced."; exit 0 }
        Write-Host "Found $($dumps.Count) dump(s)."
        # Try to locate cdb from a Windows SDK install for automated triage.
        $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        foreach ($d in $dumps) {
          Write-Host "=== $($d.FullName) ==="
          if ($cdb) {
            & $cdb.FullName -z $d.FullName -c "!analyze -v; ~*k; q" | Tee-Object -FilePath "$($d.FullName).analysis.txt"
          } else {
            Write-Host "cdb not found; upload the dump artifact and analyze locally in WinDbg."
          }
        }

    - name: Upload crash dumps + analysis
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: crash-dumps-opt-${{ matrix.opt }}
        path: |
          C:\dumps
          diag_out.xml
        if-no-files-found: ignore
        retention-days: 5
