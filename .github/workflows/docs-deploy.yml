# Build and deploy PsyNeuLink docs to GitHub Pages
# Triggers on pushes to jonhanke-dev and manual dispatch

name: Deploy Docs

on:
  push:
    branches: [jonhanke-dev]
    paths:
      - 'docs/**'
      - 'psyneulink/**'
      - 'doc_requirements.txt'
      - 'requirements.txt'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:  # allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Fetch tags
        run: git fetch --tags origin jonhanke-dev || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[doc]"

      - name: Build docs
        run: make -C docs/ html -e SPHINXOPTS="-aE -j auto"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
