name: PsyNeuLink CI

on:
  schedule:
    - cron: "35 5 * * *"
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - 'docs/**'
      - 'doc_requirements.txt'
    tags-ignore:
      - 'v**'
  pull_request:

# run only the latest instance of this workflow job for the current branch/PR
# cancel older runs
# fall back to run id if not available (run id is unique -> no cancellations)
concurrency:
  group: ci-${{ github.ref || github.run_id }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # The main test job
  build:
    # Explanation of the expression below:
    # line 1: Check if the job environment is listed in repository-scale "SELF_HOSTED" variable
    # line 2: "true" branch. Construct tag array to match one of the self hosted runners. All tags need to match.
    # line 3: "else" branch. Construct GA image description. Generally the {windows,macos,ubuntu}-latest.
    runs-on: ${{ (contains(vars.SELF_HOSTED, format(';{0}_{1}_{2};', matrix.os, matrix.python-version, matrix.extra-args))
                && fromJSON(format('[ "self-hosted","{0}", "X64", "enabled" ]', matrix.os == 'ubuntu' && 'Linux' || matrix.os)))
                || format('{0}-latest', matrix.os) }}
    env:
      # Keep DESCRIPTION in sync with the above
      DESCRIPTION: ${{ format(';{0}_{1}_{2};', matrix.os, matrix.python-version, matrix.extra-args) }}
      SELF_HOSTED: ${{ vars.SELF_HOSTED }}
    strategy:
      fail-fast: false
      matrix:
        # DIAGNOSTIC (do not merge to devel): the windows/macos legs are
        # replaced with extra ubuntu legs. Windows reproduces the crash but the
        # process dies via a fail-fast teardown that bypasses WER, so no dump is
        # ever written; linux crashes the *same* bug and a SIGSEGV reliably
        # writes a core (RLIMIT_CORE + file core_pattern, set up below). So we
        # spend the whole matrix on parallel ubuntu attempts, across both fp
        # precisions, to capture a native core per push.
        python-version: ['3.8', '3.10', '3.11', '3.12', '3.13', '3.14']
        extra-args: ['', '--fp-precision=fp32']
        os: [ubuntu]
        version-restrict: ['']
        torch: ['']
        # Bump this list (e.g. [1, 2, 3, 4]) to multiply parallel attempts/push.
        attempt: [1, 2]

    steps:
    # increased fetch-depth and tag checkout needed to get correct
    # version string from versioneer (must have history to a prior tag);
    # otherwise install fails due to circular dependency with modeci_mdf
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 200

    # fetch only master to avoid getting unneeded branches with
    # characters invalid on windows
    - name: Checkout tags
      run: git fetch --tags origin master

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restrict version of direct dependencies
      if: ${{ matrix.version-restrict == 'min' }}
      shell: bash
      run: |
        # macos/bsd sed requires backup suffix argument to -i
        sed -i=.bak -e '/^[^#]/s/>=/==/' *requirements.txt
        git config user.name "github actions"
        git config user.email "none"
        git commit -a -m "Restrict version of direct dependencies to min"

    - name: Get pip cache location
      shell: bash
      id: pip_cache
      run: |
        python -m pip install -U pip
        python -m pip --version
        echo "pip_cache_dir=$(python -m pip cache dir)" | tee -a $GITHUB_OUTPUT

    - name: Restore wheels cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pip_cache.outputs.pip_cache_dir }}/wheels
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-wheels-${{ hashFiles('requirements.txt', 'dev_requirements.txt') }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-wheels-${{ hashFiles('requirements.txt', 'dev_requirements.txt') }}

    - name: Drop PyTorch requirement
      if: ${{ matrix.torch == 'notorch' }}
      shell: bash
      run: |
        # macos/bsd sed requires backup suffix argument to -i
        sed -i=.bak -e '/torch/d' requirements.txt
        sed -i=.bak -e '/modeci_mdf/d' requirements.txt

    - name: Install PNL package
      uses: ./.github/actions/install-pnl
      id: install
      with:
        features: 'dev'

    - name: Save wheels cache
      uses: actions/cache/save@v6
      if: always()
      with:
        path: ${{ steps.pip_cache.outputs.pip_cache_dir }}/wheels
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-wheels-${{ hashFiles('requirements.txt', 'dev_requirements.txt') }}-${{ github.sha }}

    - name: Lint with Ruff
      shell: bash
      run: |
        pip install ruff

        # Run pnl configuration. This is the same as pytest -m ruff,
        # but run it early to avoid waiting for the full test run to see lint issues.
        ruff check

        # Print statistics of default settings, exit-zero treats all errors as warnings.
        ruff check --isolated --exit-zero --statistics psyneulink/ tests/


    - name: Print numpy info
      shell: bash
      run: |
        python -c "import numpy; numpy.show_config()"

    - name: Print machine info
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux*) lscpu; lsmem;;
          macOS*) sysctl -a | grep '^hw' ;;
          Windows*)
            powershell -c "Get-CimInstance -ClassName Win32_Processor | Select-Object Description,CurrentClockSpeed,NumberOfCores,NumberOfEnabledCore,NumberOfLogicalProcessors"
            powershell -c "Get-CimInstance -ClassName Win32_PhysicalMemory | Select-Object Capacity,Speed,Status,Manufacturer"
            ;;
        esac

    # Windows runners use MS Edge as the default pdf viewer.
    # This causes issues if any of the tests calls show_graph()
    # or any other routine that by default produces a .pdf file
    # and opens is in the default application.
    # The problem with MS Edge is that it intermittently fails
    # to exit and hangs the entire CI job in the last step.
    # see: https://github.com/actions/runner/issues/3383
    # Removing the default .pdf file association on windows is
    # quite difficult because it needs to check multiple places
    # and elevated privileges.
    # Installing an alternative pdf viewer works around the issue
    # as it prevents MS Edge from running when .pdf is displayed.
    - name: Install windows pdf viewer
      shell: bash
      if: ${{ matrix.os == 'windows' }}
      run: |
          choco install --no-progress -y sumatrapdf.install

    # DIAGNOSTIC (do not merge to devel): arm full crash-dump capture for the
    # intermittent Windows access-violation crash in the JIT-compiled path
    # (e.g. tests/models/test_greedy_agent.py::test_predator_prey[..._LLVMPerNode]).
    # procdump is registered as the post-mortem (AeDebug) debugger, so any test
    # worker that hits an unhandled access violation auto-dumps a full dump to
    # C:\dumps; the dumps are uploaded as an artifact after the test step.
    - name: Arm crash-dump capture (windows, diagnostic)
      shell: pwsh
      if: ${{ matrix.os == 'windows' }}
      run: |
        New-Item -ItemType Directory -Force -Path C:\dumps | Out-Null
        # Configure Windows Error Reporting LocalDumps: WerFault writes a full
        # dump for ANY crashing process (including xdist worker children) to
        # C:\dumps. More reliable than procdump's AeDebug (-i) registration,
        # which did NOT fire for the faulthandler-handled access violation.
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value 'C:\dumps' -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType   -PropertyType DWord -Value 2  -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount  -PropertyType DWord -Value 20 -Force | Out-Null
        # Ensure WER is enabled and runs headless (Session 0).
        $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
        New-ItemProperty -Path $wer -Name Disabled   -PropertyType DWord -Value 0 -Force | Out-Null
        New-ItemProperty -Path $wer -Name DontShowUI -PropertyType DWord -Value 1 -Force | Out-Null
        Write-Host "WER LocalDumps configured -> C:\dumps"

    # DIAGNOSTIC (do not merge to devel): route core dumps to files so a
    # segfaulting worker leaves a core for post-mortem. The RLIMIT_CORE soft
    # limit is raised per-process in conftest.py; here we just set the pattern
    # and make sure gdb is available for on-runner backtrace extraction.
    - name: Arm core-dump capture (linux, diagnostic)
      shell: bash
      if: ${{ matrix.os == 'ubuntu' }}
      run: |
        sudo mkdir -p /tmp/cores && sudo chmod 777 /tmp/cores
        sudo sysctl -w kernel.core_pattern='/tmp/cores/core.%e.%p.%t'
        command -v gdb >/dev/null || sudo apt-get install -y --no-install-recommends gdb
        ulimit -c unlimited || true
        echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"

    - name: Test with pytest
      timeout-minutes: 180
      run: pytest --junit-xml=tests_out.xml --verbosity=0 -n logical --capture=sys -o console_output_style=count ${{ matrix.extra-args }}

    # DIAGNOSTIC (do not merge to devel): collect + upload any crash dumps.
    - name: Collect crash dumps (windows, diagnostic)
      if: ${{ always() && matrix.os == 'windows' }}
      shell: pwsh
      run: |
        $d = Get-ChildItem C:\dumps -Filter *.dmp -ErrorAction SilentlyContinue
        if (-not $d) { Write-Host "No crash dumps produced."; exit 0 }
        Write-Host "Captured $($d.Count) crash dump(s):"; $d | ForEach-Object { Write-Host " $($_.FullName)" }
        # Best-effort: extract native backtrace with cdb if a Windows SDK debugger is present.
        $cdb = Get-ChildItem "C:\Program Files*\Windows Kits\10\Debuggers\x64\cdb.exe","C:\Program Files*\Windows Kits\*\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($cdb) {
          foreach ($dump in $d) {
            Write-Host "=== cdb !analyze -v: $($dump.Name) ==="
            & $cdb.FullName -z $dump.FullName -c "!analyze -v; ~*k; q" | Tee-Object -FilePath "$($dump.FullName).analysis.txt"
          }
        } else {
          Write-Host "cdb not found; upload dump and analyze offline in WinDbg."
        }

    - name: Upload crash dumps (windows, diagnostic)
      if: ${{ always() && matrix.os == 'windows' }}
      uses: actions/upload-artifact@v7
      with:
        name: crash-dumps-${{ matrix.os }}-${{ matrix.python-version }}
        path: C:\dumps
        if-no-files-found: ignore
        retention-days: 5

    # DIAGNOSTIC (do not merge to devel): extract native backtraces from any
    # cores on the runner (where the exact binary + libs are present to
    # symbolize), then upload both the backtraces and the raw cores.
    - name: Collect core dumps (linux, diagnostic)
      if: ${{ always() && matrix.os == 'ubuntu' }}
      shell: bash
      run: |
        shopt -s nullglob
        cores=(/tmp/cores/core.*)
        BT=/tmp/cores/backtraces.txt
        echo "Found ${#cores[@]} core(s)." | tee "$BT"
        if [ ${#cores[@]} -eq 0 ]; then exit 0; fi
        PYBIN="$(python -c 'import sys; print(sys.executable)')"
        echo "python: $PYBIN" | tee -a "$BT"
        for c in "${cores[@]}"; do
          echo "===================== $c =====================" | tee -a "$BT"
          gdb -q -batch -nx \
            -ex "thread apply all bt" \
            -ex "printf \"\n---- faulting thread registers ----\n\"" \
            -ex "info registers rip rsp rbp" \
            -ex "printf \"\n---- disassembly around pc ----\n\"" \
            -ex "x/16i \$pc" \
            -ex "printf \"\n---- symbol at pc / mappings ----\n\"" \
            -ex "info symbol \$pc" \
            "$PYBIN" "$c" 2>&1 | tee -a "$BT"
        done

    - name: Upload core dumps + backtraces (linux, diagnostic)
      if: ${{ always() && matrix.os == 'ubuntu' }}
      uses: actions/upload-artifact@v7
      with:
        name: core-dumps-${{ matrix.python-version }}-job${{ strategy.job-index }}${{ matrix.extra-args != '' && '-fp32' || '' }}
        path: /tmp/cores
        if-no-files-found: ignore
        retention-days: 5

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.python-version }}-job${{ strategy.job-index }}
        path: tests_out.xml
        retention-days: 5
      if: (success() || failure()) && ! contains(matrix.extra-args, 'forked')

    - name: Check that PyTorch wasn't transitively included
      if: ${{ matrix.torch == 'notorch' }}
      shell: bash
      run: |
        ! pip show torch

    - name: Upload coveralls code coverage
      if: contains(matrix.extra-args, '--cov=psyneulink')
      shell: bash
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      run: |
        if [ -n "$COVERALLS_REPO_TOKEN" ]; then
          pip install coveralls
          coveralls
        else
          echo "::warning::Not uploading to coveralls.io, token not available!"
        fi

    - name: Upload dist packages
      uses: actions/upload-artifact@v7
      if: matrix.version-restrict == ''
      with:
        name: dist-${{ matrix.python-version }}-job${{ strategy.job-index }}
        path: |
          ${{ steps.install.outputs.wheel }}
          ${{ steps.install.outputs.sdist }}
        retention-days: 2

    # this step is kept for debugging hangs at the end of runner execution.
    - name: List running processes
      shell: pwsh
      if: ${{ matrix.os == 'windows' }}
      run: |
        Get-Process;
